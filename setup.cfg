[metadata]
name = dynamic-lead-scoring-churn
version = 0.1.0
description = Dynamic Lead Scoring & Churn Early Warning Engine
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
license = MIT
url = https://github.com/yourusername/dynamic-lead-scoring-churn
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    Django>=4.2,<5.0
    pandas>=2.1
    numpy>=1.26
    scikit-learn>=1.4
    shap>=0.44
    psycopg2-binary>=2.9
    openpyxl>=3.1
    python-dotenv>=1.0
    gunicorn>=21.2
    plotly>=5.18
